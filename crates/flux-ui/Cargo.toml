[package]
name = "flux-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "egui presentation layer for Flux Files"

[dependencies]
flux-core.workspace = true
flux-platform.workspace = true
flux-operations.workspace = true
flux-search.workspace = true
flux-settings.workspace = true
egui.workspace = true
egui_extras.workspace = true
eframe.workspace = true
jiff.workspace = true
rustc-hash.workspace = true
tracing.workspace = true
portable-pty.workspace = true
alacritty_terminal.workspace = true
image.workspace = true
sha2 = "0.11.1"
kamadak-exif = "0.6"
mime_guess = "2"
fs2.workspace = true

# Owner/group name resolution — std exposes uid/gid on unix only.
[target.'cfg(unix)'.dependencies]
uzers = "0.12.2"

# Drag files OUT of the window to the OS. macOS/Windows only — the Linux
# GTK backend can't interoperate with winit (documented limitation).
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
drag = "2.1.1"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
