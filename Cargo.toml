[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
flux-core = { path = "crates/flux-core" }
flux-platform = { path = "crates/flux-platform" }
flux-operations = { path = "crates/flux-operations" }
flux-search = { path = "crates/flux-search" }
flux-settings = { path = "crates/flux-settings" }
flux-ui = { path = "crates/flux-ui" }

eframe = { version = "0.36", default-features = false, features = [
    "glow",
    "default_fonts",
    "persistence",
    "accesskit",
    "wayland",
    "x11",
] }
egui = "0.36"
egui_extras = "0.36"

trash = "5"
notify = "8"
fs2 = "0.4"
directories = "6"
filetime = "0.2"
regex = "1"
rustc-hash = "2"
same-file = "1"
portable-pty = "0.9"
alacritty_terminal = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jiff = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

criterion = { version = "0.8", features = ["html_reports"] }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = { level = "allow", priority = -1 }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"

[profile.release-debug]
inherits = "release"
debug = true
strip = "none"
